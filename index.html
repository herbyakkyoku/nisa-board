<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新NISA戦況板 | オルカン vs S&P500</title>
    <style>
        :root { --y-blue: #188fff; --y-red: #ff333e; --y-bg: #f6f6f6; --y-border: #dcdcdc; --y-text: #333; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif; background-color: var(--y-bg); color: var(--y-text); margin: 0; padding: 0; }
        header { background: #fff; border-bottom: 2px solid #ff0033; padding: 8px 15px; display: flex; align-items: center; justify-content: space-between; }
        header h1 { font-size: 1.1rem; margin: 0; font-weight: bold; }
        .live-label { font-size: 0.7rem; color: #ff0033; border: 1px solid #ff0033; padding: 1px 5px; border-radius: 2px; font-weight: bold; }
        .container { max-width: 750px; margin: 0 auto; background: #fff; min-height: 100vh; border-left: 1px solid var(--y-border); border-right: 1px solid var(--y-border); }
        .stock-info { padding: 15px; border-bottom: 6px solid var(--y-bg); display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .s-box { border: 1px solid var(--y-border); padding: 10px; border-radius: 3px; }
        .s-name { font-size: 0.75rem; color: #666; margin-bottom: 3px; font-weight: bold; }
        .s-price { font-size: 1.5rem; font-weight: bold; font-family: 'Arial'; }
        .up { color: #cc0000; }
        .post-section { padding: 20px; border-bottom: 1px solid var(--y-border); background: #fafafa; }
        .tab-row { display: flex; gap: 8px; margin-bottom: 12px; }
        .tab { border: 1px solid var(--y-border); background: #fff; padding: 6px 12px; font-size: 0.8rem; cursor: pointer; border-radius: 2px; color: #666; }
        .tab.active-b { border-color: var(--y-blue); color: var(--y-blue); font-weight: bold; background: #f0f8ff; }
        .tab.active-r { border-color: var(--y-red); color: var(--y-red); font-weight: bold; background: #fff5f5; }
        textarea { width: 100%; height: 60px; border: 1px solid var(--y-border); padding: 10px; box-sizing: border-box; font-size: 0.9rem; margin-bottom: 10px; }
        .post-footer { display: flex; justify-content: flex-end; }
        .post-btn { background: #444; color: #fff; border: none; padding: 7px 30px; border-radius: 2px; font-size: 0.85rem; cursor: pointer; font-weight: bold; }
        .comment-card { padding: 15px 20px; border-bottom: 1px solid var(--y-border); }
        .c-meta { font-size: 0.75rem; margin-bottom: 8px; color: #666; display: flex; align-items: center; gap: 10px; }
        .line-b { border-left: 4px solid var(--y-blue); }
        .line-r { border-left: 4px solid var(--y-red); }
        .c-text { font-size: 0.95rem; line-height: 1.5; color: #000; word-wrap: break-word; }
        .react-row { margin-top: 12px; display: flex; gap: 10px; }
        .react-btn { background: #fff; border: 1px solid #ccc; color: #333; font-size: 0.7rem; padding: 3px 10px; border-radius: 2px; cursor: pointer; }
    </style>
</head>
<body>

<header>
    <h1>新NISA戦況板</h1>
    <div class="live-label">LIVE STREAMING</div>
</header>

<div class="container">
    <div class="stock-info">
        <div class="s-box">
            <div class="s-name">三菱UFJ－eMAXIS Slim 全世界株式</div>
            <div class="s-price up">35,154 <span style="font-size:0.8rem;">+0.70%</span></div>
        </div>
        <div class="s-box">
            <div class="s-name">三菱UFJ－eMAXIS Slim 米国株式</div>
            <div class="s-price up">40,213 <span style="font-size:0.8rem;">+1.03%</span></div>
        </div>
    </div>

    <div class="post-section">
        <div class="tab-row">
            <button id="t-b" class="tab" onclick="setF('b')">オルカン派</button>
            <button id="t-r" class="tab" onclick="setF('r')">S&P500派</button>
        </div>
        <textarea id="txt" placeholder="コメントを入力してください（ライブ連動中）"></textarea>
        <div class="post-footer">
            <button class="post-btn" onclick="send()">投稿する</button>
        </div>
    </div>
    <div id="list"></div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // スクショから取得した航さんのConfigを反映
    const firebaseConfig = {
        apiKey: "AIzaSyAo9pTqdm-GQ9CleOcwg6nEYzNXebLCevc",
        authDomain: "nisa-board.firebaseapp.com",
        projectId: "nisa-board",
        storageBucket: "nisa-board.firebasestorage.app",
        messagingSenderId: "639597394359",
        appId: "1:639597394359:web:438fb676bf3108b9645032",
        measurementId: "G-C7953H1NW1"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const commentsCol = collection(db, "comments");

    window.currentSide = '';
    window.setF = (side) => {
        window.currentSide = side;
        document.getElementById('t-b').className = 'tab' + (side === 'b' ? ' active-b' : '');
        document.getElementById('t-r').className = 'tab' + (side === 'r' ? ' active-r' : '');
    };

    window.send = async () => {
        const text = document.getElementById('txt').value;
        if (!window.currentSide || !text) { alert('派閥選択と入力をしてください'); return; }
        try {
            await addDoc(commentsCol, {
                side: window.currentSide,
                text: text,
                createdAt: serverTimestamp(),
                agree: 0,
                disagree: 0
            });
            document.getElementById('txt').value = '';
        } catch (e) { alert('エラーが発生しました。Firestoreの設定（テストモード）を確認してください。'); }
    };

    const q = query(commentsCol, orderBy("createdAt", "desc"));
    onSnapshot(q, (snapshot) => {
        const list = document.getElementById('list');
        list.innerHTML = '';
        snapshot.forEach((doc) => {
            const data = doc.data();
            const sideClass = data.side === 'b' ? 'line-b' : 'line-r';
            const sideLabel = data.side === 'b' ? 'オルカン派' : 'S&P500派';
            const sideColor = data.side === 'b' ? '#188fff' : '#ff333e';
            const time = data.createdAt ? data.createdAt.toDate().toLocaleString('ja-JP', {hour:'2-digit', minute:'2-digit'}) : '...';

            const div = document.createElement('div');
            div.className = `comment-card ${sideClass}`;
            div.innerHTML = `<div class="c-meta"><span style="color:${sideColor}; font-weight:bold;">${sideLabel}</span><span class="c-id">匿名投資家</span><span>${time}</span></div><div class="c-text">${data.text}</div><div class="react-row"><button class="react-btn">そう思う <span class="count">${data.agree || 0}</span></button><button class="react-btn">そう思わない <span class="count">${data.disagree || 0}</span></button></div>`;
            list.appendChild(div);
        });
    });
</script>
</body>
</html>
